# Build the docs + Storybook site and deploy it to Netlify.
#
#   push to main      → production deploy
#   pull request      → preview deploy, URL posted as a PR comment
#   manual dispatch   → production deploy
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  personal access token (Netlify → User settings → Applications)
#   NETLIFY_SITE_ID     the site's API ID (Site configuration → General → Site details)
#
# Pull requests from forks don't receive secrets, so their preview job is skipped.
name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.netlify.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/storybook/package-lock.json

      - name: Build site
        run: bash scripts/netlify-build.sh

      - name: Check Netlify secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID must be set as repository secrets."
            exit 1
          fi

      - name: Deploy
        id: netlify
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ARGS=(--alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER: $PR_TITLE")
          else
            ARGS=(--prod --message "$SHA")
          fi
          npx --yes netlify-cli@23 deploy --dir=dist --no-build --json "${ARGS[@]}" > deploy.json
          cat deploy.json
          if [ "$EVENT" = "pull_request" ]; then
            URL=$(node -p "require('./deploy.json').deploy_url")
          else
            URL=$(node -p "const d = require('./deploy.json'); d.url || d.deploy_url")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Netlify: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.netlify.outputs.url }}
        with:
          script: |
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\n**Netlify preview:** ${process.env.DEPLOY_URL}\n\nDocs at \`/\`, Storybook at \`/storybook/\`. Built from ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
