# Type-check, lint, test and build every package on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true

      - name: Type-check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Test
        run: deno task test

  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true

      - name: Build all packages
        run: deno task build
