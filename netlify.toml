# ─────────────────────────────────────────────────────────────────────────────
# Netlify config for Adhar UI — a single site assembled from two apps:
#   /            docs       (flagship marketing + documentation)
#   /storybook/  storybook  (component workshop)
#
# Deploys run from GitHub Actions (.github/workflows/deploy.yml), which builds
# ./dist and uploads it with the Netlify CLI. The CLI still applies the
# redirects and headers below. [build] is kept so a Git-linked Netlify site
# also works, but disable Netlify's own builds if Actions is deploying, or
# every push builds twice.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  DENO_VERSION = "v2.9.5"
  NODE_VERSION = "20"
  # Deno caches npm deps here; keeps CI installs quiet.
  NPM_FLAGS = "--no-audit --no-fund"

# ── SPA fallbacks ────────────────────────────────────────────────────────────
# Existing files are always served first (force = false, the default), so real
# assets under /storybook are untouched. These only catch unknown paths and
# route them to the owning app's entry document.

# The page builder app was retired; send old links to the docs home.
[[redirects]]
  from = "/builder"
  to = "/"
  status = 301

[[redirects]]
  from = "/builder/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/storybook/*"
  to = "/storybook/index.html"
  status = 200

# Docs uses hash routing, so the root document handles every remaining path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers (all routes) ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# ── Long-lived caching for fingerprinted build assets ────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/storybook/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
