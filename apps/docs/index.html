<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhar UI — Documentation</title>
    <meta name="description" content="Framework-agnostic design system and component library. Own your components. Ship to any framework." />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/branding/adhar-logo.png" />
    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adhar UI — Documentation" />
    <meta property="og:description" content="Framework-agnostic design system and component library. Own your components. Ship to any framework." />
    <meta property="og:image" content="/branding/banner-og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adhar UI — Documentation" />
    <meta name="twitter:image" content="/branding/banner-og.svg" />
    <!-- Inter font for clean UI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Prevent FOUC — show nothing until styles load */
      html { visibility: hidden; }
      html.loaded { visibility: visible; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>document.documentElement.classList.add('loaded');</script>
  </body>
</html>
